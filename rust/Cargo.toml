[package]
name = "hood-melville"
version = "0.1.0"
edition = "2024"
# Стабильный allocator API (`Queue<T, R, A: Allocator>`).
rust-version = "1.100"
description = "Persistent real-time queue of Hood and Melville: worst-case O(1) push, pop and front"
license = "MIT"
repository = "https://github.com/zornfeuer/hood-melville"
keywords = ["queue", "persistent", "functional", "immutable", "data-structures"]
categories = ["data-structures"]

[lints.rust]
# Ссылка, тут же превращённая в сырой указатель (`&x as *const _`), — в
# модулях с `unsafe` (`node`, `pool`) лучше `&raw const`.
raw_borrows_via_references = "warn"

[dependencies]

[dev-dependencies]
criterion = "0.8.2"
dhat = "0.3.3"
proptest = "1.12.0"
rayon = "1.12.0"

[[test]]
name = "alloc"
harness = false

[[bench]]
name = "queue"
harness = false

# Максимальная оптимизация для сравнения с C (`just bench-compare`);
# target-cpu=native передаётся через RUSTFLAGS.
[profile.max]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
