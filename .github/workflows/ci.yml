name: ci

# Every job runs the same `just` recipes as a local check (CONTRIBUTING.md),
# so a green local run and a green CI run mean the same thing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Formatters and linters for all sources: libraries, tests, benchmarks and
  # scripts. On macOS: the allocator shims in bench/alloc and bench/snapshot
  # are macOS-only and are checked here too.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: extractions/setup-just@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: brew install jemalloc
      - run: just lint

  c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just c-test
      - run: just c-asan
      - run: just c-tsan
      - if: runner.os == 'macOS'
        run: just c-leaks
      - run: just c-install-check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: just rust-test

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: just rust-miri

  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: just zig-test
      - run: just zig-build
