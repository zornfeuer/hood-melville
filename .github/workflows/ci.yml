name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and test
        run: |
          cmake -S c -B build/c
          cmake --build build/c
          ./build/c/fqueue_test --skip-benchmarks
          ./build/c/fqueue_limits_test
      - name: test under ASan/UBSan
        run: |
          cmake -S c -B build/c-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/c-asan --target fqueue_test fqueue_limits_test
          ./build/c-asan/fqueue_test --skip-benchmarks
          ./build/c-asan/fqueue_limits_test
      - name: install as a package and use it
        run: |
          cmake -S c -B build/c-pkg -DBUILD_SHARED_LIBS=ON -DHOOD_MELVILLE_BUILD_TESTS=OFF \
            -DHOOD_MELVILLE_BUILD_BENCH=OFF -DHOOD_MELVILLE_INSTALL=ON
          cmake --build build/c-pkg
          cmake --install build/c-pkg --prefix "$PWD/build/c-prefix"
          cmake -S c/examples/consumer -B build/consumer -DCMAKE_PREFIX_PATH="$PWD/build/c-prefix"
          cmake --build build/consumer
          ./build/consumer/consumer

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - run: cargo test
      - run: cargo test --release

  miri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - run: cargo miri test --lib --test scenarios --test model --test branching
      - run: cargo miri test --lib
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance
